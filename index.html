<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="meta-theme" content="#faf8f3">
<title>Prisma · Jogos online</title>
<meta name="description" content="Prisma: jogos online para jogar com amigos ou contra o computador.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Prisma">
<meta property="og:title" content="Prisma · Jogos online">
<meta property="og:description" content="Jogos para jogar com amigos ou contra o computador.">
<meta property="og:url" content="https://prisma-io.netlify.app/">
<meta property="og:image" content="https://prisma-io.netlify.app/img/og.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1024">
<meta property="og:image:height" content="1024">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Prisma · Jogos online">
<meta name="twitter:description" content="Jogos para jogar com amigos ou contra o computador.">
<meta name="twitter:image" content="https://prisma-io.netlify.app/img/og.jpg">
<link rel="apple-touch-icon" href="img/apple-touch-icon.jpg">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='28' fill='%23faf8f3'/%3E%3Cpath d='M64 22 110 100H18Z' fill='none' stroke='%231f1f1e' stroke-width='9' stroke-linejoin='round'/%3E%3Cpath d='M64 22 86 100' stroke='%232563eb' stroke-width='9' stroke-linecap='round'/%3E%3Cpath d='M64 22 42 100' stroke='%23dc2626' stroke-width='9' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#faf8f3;--fg:#1f1f1e;--muted:#6b6860;--line:#ded8ca;--card:#fff;--p1:#2563eb;--p2:#dc2626;--p3:#f59e0b;--p4:#16a34a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#181817;--fg:#f2f0eb;--muted:#9e9a90;--line:#363532;--card:#232321;--p1:#60a5fa;--p2:#f87171;--p3:#fbbf24;--p4:#4ade80}}
:root[data-theme="dark"]{--bg:#181817;--fg:#f2f0eb;--muted:#9e9a90;--line:#363532;--card:#232321;--p1:#60a5fa;--p2:#f87171;--p3:#fbbf24;--p4:#4ade80}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom))}
main{width:100%;max-width:760px;margin:auto 0;padding:8px 0}
.bar{display:flex;justify-content:flex-end;margin-bottom:6px}
#theme-btn{font:inherit;min-height:40px;min-width:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;font-size:1rem}
header{text-align:center;margin-bottom:28px}
.logo{width:76px;height:76px;margin:0 auto 10px;display:block}
h1{margin:0;font-size:2rem;letter-spacing:-.03em}
.tag{margin:6px 0 0;color:var(--muted);font-size:.95rem}
.spectrum{display:flex;justify-content:center;gap:6px;margin-top:14px}
.spectrum i{width:28px;height:4px;border-radius:999px;display:block}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.game{display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:20px;background:var(--card);border:1px solid var(--line);color:inherit;text-decoration:none;transition:transform .15s,border-color .15s}
.game:hover{transform:translateY(-2px);border-color:var(--accent)}
.game:active{transform:scale(.99)}
.game:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ico{width:52px;height:52px;border-radius:14px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.ico svg{width:30px;height:30px}
.game h2{margin:0;font-size:1.15rem;letter-spacing:-.01em}
.game p{margin:0;color:var(--muted);font-size:.88rem;line-height:1.45;flex:1}
.modes{display:flex;flex-wrap:wrap;gap:6px}
.modes span{font-size:.74rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.play{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:.9rem;color:var(--accent)}
.foot{text-align:center;color:var(--muted);font-size:.76rem;margin:28px 0 0;opacity:.75}
.soon-note{margin:14px 0 0;padding:10px 14px;border:1px dashed var(--line);border-radius:14px;background:var(--card);color:var(--muted);font-size:.82rem;text-align:center}
.cover{display:block;margin:-20px -20px 0;width:calc(100% + 40px);aspect-ratio:16/9;object-fit:cover;border-radius:20px 20px 0 0;background:var(--bg)}
main{position:relative}
@media (max-width:600px){
  header{margin-bottom:20px}
  .logo{width:52px;height:52px;margin-bottom:6px}
  h1{font-size:1.7rem}
  .tag{font-size:.88rem}
  .spectrum{margin-top:10px}
  .bar{position:absolute;top:0;right:0;margin:0}
  main{padding-top:0}
}
/* Layout compacto: duas colunas, capas 4:3 e modos visíveis */
.games{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.game{padding:0;gap:0;overflow:hidden;border-radius:18px}
.game .cover{margin:0;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:0}
.game .ico,.game p{display:none}
.game .modes{display:flex;gap:4px;padding:0 12px 10px}
.game .modes span{font-size:.61rem;padding:2px 6px}
.game h2{padding:10px 12px 0;font-size:.98rem;line-height:1.2}
.game .play{padding:6px 12px 12px;font-size:.84rem}
@media (max-width:360px){.game h2{font-size:.9rem}}
</style>
</head>
<body>
<main>
  <div class="bar"><button id="theme-btn" type="button" aria-label="Alternar tema">🌓</button></div>

  <header>
    <svg class="logo" viewBox="0 0 128 128" fill="none" aria-hidden="true">
      <path d="M64 20 112 102H16Z" stroke="var(--fg)" stroke-width="7" stroke-linejoin="round"/>
      <path d="M8 74 44 62" stroke="var(--fg)" stroke-width="5" stroke-linecap="round"/>
      <path d="M64 20 88 102" stroke="var(--p1)" stroke-width="7" stroke-linecap="round"/>
      <path d="M64 20 40 102" stroke="var(--p2)" stroke-width="7" stroke-linecap="round"/>
    </svg>
    <h1>Prisma</h1>
    <p class="tag">Jogos para jogar com amigos ou contra o computador</p>
    <div class="spectrum" aria-hidden="true">
      <i style="background:var(--p2)"></i><i style="background:var(--p3)"></i><i style="background:var(--p4)"></i><i style="background:var(--p1)"></i>
    </div>
  </header>

  <div class="games" id="games"></div>
  <p class="soon-note">Mais jogos em breve · novos jogos vão aparecer aqui.</p>

  <p class="foot">Developed by Max</p>
</main>

<script>
/* Para adicionar um jogo novo: crie uma pasta com o index.html dele e inclua mais um item aqui. */
const GAMES = [
  {
    nome: 'Entre Pontos',
    desc: 'Ligue os pontos e feche mais quadrados que o adversário.',
    url: 'entre-pontos/index.html',
    cor: 'var(--p1)',
    capa: 'entre-pontos/img/og.jpg',
    modos: ['Online', 'Contra o computador', '2 jogadores'],
    icone: '<svg viewBox="0 0 32 32" fill="none"><line x1="7" y1="7" x2="25" y2="7" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line x1="25" y1="7" x2="25" y2="25" stroke="var(--p2)" stroke-width="3" stroke-linecap="round"/><line x1="7" y1="7" x2="7" y2="25" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="7" cy="7" r="3.2" fill="var(--fg)"/><circle cx="25" cy="7" r="3.2" fill="var(--fg)"/><circle cx="7" cy="25" r="3.2" fill="var(--fg)"/><circle cx="25" cy="25" r="3.2" fill="var(--fg)"/></svg>'
  },
  {
    nome: 'Batalha Naval',
    desc: 'Posicione sua frota, encontre e afunde todos os navios inimigos.',
    url: 'batalha-naval/index.html',
    cor: 'var(--p2)',
    capa: 'batalha-naval/img/og.jpg',
    modos: ['Online', 'Contra o computador', '2 jogadores'],
    icone: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h24l-3 6H7z"/><path d="M16 20V6l7 9h-7"/><path d="M3 29c3-1.5 5 1.5 8 0s5 1.5 8 0 5 1.5 8 0" stroke-width="1.8"/></svg>'
  },
  {
    nome: 'Connect Four',
    desc: 'Alinhe quatro peças na horizontal, vertical ou diagonal antes do adversário.',
    url: 'connect-four/index.html',
    cor: 'var(--p3)',
    capa: 'connect-four/img/og.jpg',
    modos: ['Online', 'Contra o computador', '2 jogadores'],
    icone: '<svg viewBox="0 0 32 32" fill="none"><rect x="3" y="6" width="26" height="22" rx="3" stroke="currentColor" stroke-width="2.4"/><circle cx="10" cy="13" r="2.4" fill="var(--p1)"/><circle cx="16" cy="13" r="2.4" fill="var(--p2)"/><circle cx="22" cy="13" r="2.4" fill="var(--p1)"/><circle cx="10" cy="20" r="2.4" fill="var(--p2)"/><circle cx="16" cy="20" r="2.4" fill="var(--p1)"/><circle cx="22" cy="20" r="2.4" fill="var(--p2)"/></svg>'
  },
  {
    nome: 'Jogo da Memória',
    desc: 'Encontre os pares antes do adversário e lembre onde cada carta estava.',
    url: 'jogo-da-memoria/index.html',
    cor: 'var(--p4)',
    capa: 'jogo-da-memoria/img/og.jpg',
    modos: ['Online', 'Contra o computador', '2 jogadores'],
    icone: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="4" y="4" width="10" height="10" rx="2"/><rect x="18" y="4" width="10" height="10" rx="2"/><rect x="4" y="18" width="10" height="10" rx="2"/><rect x="18" y="18" width="10" height="10" rx="2" stroke="var(--p1)"/><path d="M21 22.5l2 2 3.5-3.5" stroke="var(--p1)" stroke-width="2.4" stroke-linecap="round"/></svg>'
  }
];

const wrap = document.getElementById('games');
wrap.innerHTML = GAMES.map(g => `
  <a class="game" href="${g.url}" style="--accent:${g.cor}">
    <img class="cover" src="${g.capa}" alt="" loading="lazy">
    <div class="ico">${g.icone}</div>
    <h2>${g.nome}</h2>
    <p>${g.desc}</p>
    <div class="modes">${g.modos.map(m => `<span>${m}</span>`).join('')}</div>
    <div class="play"><span>Jogar</span><span aria-hidden="true">›</span></div>
  </a>`).join('');

/* Tema */
const store = {
  get(k){ try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }
};
const saved = store.get('prisma_theme');
if (saved) document.documentElement.dataset.theme = saved;
function isDark(){
  const ds = document.documentElement.dataset.theme;
  return ds ? ds === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches;
}
function syncMeta(){ document.getElementById('meta-theme').setAttribute('content', isDark() ? '#181817' : '#faf8f3'); }
document.getElementById('theme-btn').onclick = () => {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  store.set('prisma_theme', next);
  syncMeta();
};
matchMedia('(prefers-color-scheme:dark)').addEventListener('change', syncMeta);
syncMeta();
</script>
</body>
</html>
