<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta property="og:image" content="https://prisma-io.netlify.app/xadrez/img/og.jpg">

<script>
try{var t=localStorage.getItem('prisma_theme');if(t)document.documentElement.dataset.theme=t;var d=t?t==='dark':matchMedia('(prefers-color-scheme:dark)').matches;document.getElementById('meta-theme').content=d?'#181817':'#faf8f3';}catch(e){}
try{if(/^xadrez-[a-z0-9]{7}$/.test(location.hash.slice(1).toLowerCase()))document.documentElement.classList.add('invite-link');}catch(e){}
</script>
<link rel="stylesheet" href="../tabuleiro/prisma.css">
<style>html.invite-link #menu{display:none!important}html.invite-link #lobby{display:block!important}html.invite-link #lobby #online-setup,html.invite-link #lobby #invite{display:none!important}html.invite-link #lobby #join{display:block!important}html.invite-link #lobby #join-code-wrap{display:none!important}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js" async></script>
</head>
<body>
<main data-game="xadrez">
  <section id="menu" class="card">
    <div class="nav-row"><a class="back" href="../index.html">← Prisma</a><button class="sec theme-toggle" type="button" aria-label="Alternar tema">🌓</button></div>
    <div>
      <div class="brand"><span aria-hidden="true">♞</span><h1>Xadrez</h1></div>
      <p class="sub">Proteja seu rei e dê xeque-mate.</p>
      <div class="modes">
        <button class="mc" id="online"><span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></span><span class="mc-txt"><strong>Online</strong><span class="d">Com amigo via link ou código</span></span><span class="chev" aria-hidden="true">›</span></button>
        <button class="mc" id="computer"><span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="12" rx="3"/><path d="M12 2v6"/><circle cx="12" cy="2" r="1"/><circle cx="9" cy="14" r="1"/><circle cx="15" cy="14" r="1"/></svg></span><span class="mc-txt"><strong>Contra o computador</strong><span class="d">Fácil, médio ou difícil</span></span><span class="chev" aria-hidden="true">›</span></button>
        <button class="mc" id="local"><span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span><span class="mc-txt"><strong>2 jogadores</strong><span class="d">Localmente no mesmo aparelho</span></span><span class="chev" aria-hidden="true">›</span></button>
      </div>
      <button class="lk" id="show-join">Tenho um código de sala</button>
    </div>
  </section>
  <section id="setup" class="hide card">
    <div class="nav-row"><button class="ghost back-menu">← Voltar</button></div><h1 id="setup-heading" class="setup-title">Contra o Computador</h1>
    <div class="r2"><div><label class="fld" for="local-name">Jogador 1</label><input id="local-name" maxlength="14" placeholder="Ex: Max"></div><div id="second-player" class="hide"><label class="fld" for="second-name">Jogador 2</label><input id="second-name" maxlength="14" placeholder="Ex: Jogador 2"></div></div>
    <div id="difficulty-setup"><label class="fld">Dificuldade</label><div class="difficulty"><button data-level="easy">Fácil</button><button data-level="mid">Médio</button><button data-level="hard">Difícil</button></div></div>
    <button id="start-ai" class="full">Jogar</button>
  </section>
  <section id="lobby" class="hide card">
    <div class="nav-row">
      <button class="ghost back-menu" id="lobby-back">← Voltar</button>
      <span class="badge hide" id="room-badge"><span class="pulse" aria-hidden="true"></span><span id="lobby-status">Sala pronta</span></span>
      <span class="badge hide" id="join-badge"></span>
    </div>
    <h1 id="lobby-title" class="setup-title">Entrar na sala</h1>
    <div id="online-setup">
      <label class="fld" for="player-name">Seu nome</label><input id="player-name" maxlength="14" placeholder="Ex: Max">
      <button class="full" id="create">Criar sala</button>
    </div>
    <div id="invite" class="hide">
      <p class="sub" id="lobby-info"></p>
      <button class="room" id="copy-code" aria-label="Copiar código da sala"><strong id="room-code"></strong><small>Toque para copiar o código</small></button>
      <div class="stack"><button class="wa" id="share-link">Enviar no WhatsApp</button><button class="sec" id="copy-link">Copiar link</button></div>
      <p class="hint">Mantenha esta tela aberta até seu amigo entrar.</p>
    </div>
    <form id="join" class="hide">
      <div id="join-code-wrap"><label class="fld" for="code">Código da sala</label><input id="code" placeholder="xadrez-xxxxxxx" autocomplete="off"></div>
      <label class="fld" for="join-name">Seu nome</label><input id="join-name" maxlength="14" placeholder="Como quer ser chamado(a)?">
      <button class="full" id="join-button">Entrar</button>
    </form>
    <p id="lobby-status-join" class="hint" role="status"></p>
  </section>
  <section id="game" class="hide">
    <div class="nav-row"><button class="sec back-menu">← Sair</button><span id="mode"></span><button class="sec theme-toggle" type="button" aria-label="Alternar tema">🌓</button><button class="sec sound" aria-label="Alternar som" id="sound">🔊</button></div>
    <div id="score" class="score"></div>
    <p id="message" role="status"></p>
    <div id="board" aria-label="Tabuleiro" role="group"></div>
    <div id="promotion" class="hide" role="group" aria-label="Promoção do peão"></div>
    <div class="end hide" id="end-bar"><button id="again">Jogar novamente</button><button class="sec back-menu">Menu inicial</button></div>
  </section>
  <footer>Developed by Max :)</footer>
</main>
<script type="module" src="../tabuleiro/ui.mjs"></script>
</body>
</html>
