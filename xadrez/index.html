<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xadrez · Prisma</title>
<link rel="icon" href="../img/icon.jpg">
<link rel="stylesheet" href="../tabuleiro/prisma.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js" async></script>
<main data-game="xadrez">
  <section id="menu">
    <a class="back" href="../index.html">← Prisma</a>
    <div class="card">
      <h1>Xadrez</h1>
      <p class="sub">Proteja seu rei e dê xeque-mate.</p>
      <div class="modes">
        <button class="mc" id="online"><span class="mc-txt"><strong>Online</strong><span class="d">Com amigo via link ou código</span></span>›</button>
        <button class="mc" id="computer"><span class="mc-txt"><strong>Contra o computador</strong><span class="d">Treine suas jogadas</span></span>›</button>
        <button class="mc" id="local"><span class="mc-txt"><strong>2 jogadores</strong><span class="d">No mesmo aparelho</span></span>›</button>
      </div>
      <button class="lk" id="show-join">Tenho um código de sala</button>
    </div>
  </section>
  <section id="setup" class="hide card">
    <button class="ghost back-menu">← Voltar</button><h1 class="setup-title">Contra o Computador</h1>
    <label class="fld">Dificuldade</label><div class="difficulty"><button data-level="easy">Fácil</button><button data-level="mid">Médio</button><button data-level="hard">Difícil</button></div>
    <button id="start-ai" class="full">Jogar</button>
  </section>
  <section id="lobby" class="hide card">
    <button class="ghost back-menu">← Voltar</button>
    <h1 id="lobby-title" class="setup-title">Partida Online</h1>
    <div id="online-setup">
      <label class="fld" for="player-name">Seu nome</label><input id="player-name" maxlength="14" placeholder="Ex: Max">
      <button class="full" id="create">Criar sala</button>
    </div>
    <div id="invite" class="hide">
      <span class="badge"><span class="pulse"></span><span id="lobby-status">Sala pronta</span></span><h2 class="center">Aguardando amigo</h2>
      <p class="sub" id="lobby-info"></p><button class="room full sec" id="copy-code" aria-label="Copiar código da sala"></button>
      <div class="stack"><button class="wa" id="share-link">Enviar no WhatsApp</button><button class="sec" id="copy-link">Copiar link</button></div><p class="hint">Mantenha esta tela aberta até seu amigo entrar.</p>
    </div>
    <form id="join" class="hide">
      <label class="fld" for="code">Código da sala</label><input id="code" placeholder="xadrez-xxxxxxxx" autocomplete="off">
      <label class="fld" for="join-name">Seu nome</label><input id="join-name" maxlength="14" placeholder="Como quer ser chamado(a)?">
      <button class="full" id="join-button">Entrar</button><p id="lobby-status-join" role="status"></p>
    </form>
  </section>
  <section id="game" class="hide">
    <div class="nav-row"><button class="sec back-menu">← Sair</button><span id="mode"></span><button class="sec sound" aria-label="Alternar som" id="sound">🔊</button></div>
    <div id="score" class="score"></div>
    <p id="message" role="status"></p>
    <div id="board" aria-label="Tabuleiro" role="group"></div>
    <div id="promotion" class="hide" role="group" aria-label="Promoção do peão"></div>
    <button class="full sec hide" id="again">Revanche</button>
  </section>
  <footer>Developed by Max</footer>
</main>
<script type="module" src="../tabuleiro/ui.mjs"></script>
</html>
